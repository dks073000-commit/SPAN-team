<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e4e9">
  <title>텅장방어전 · 방</title>
  <!-- 모양은 UI 가이드(static/board/ui-guide.html) 그대로. 기능(API · 저장)은 원래 방 레인 것 그대로다 -->
  <link rel="stylesheet" href="/static/board/common-proposal.css">
  <link rel="stylesheet" href="/static/board/flow/flow.css">
</head>
<body>
<!-- 방 홈 · 참여. 순서 = 실제 오픈뱅킹 순서:
       ① 정보 입력(이 화면) → ② 은행 연결 동의 · ③ 계좌 선택 (가짜 은행 화면 /api/expenses/mockbank/oauth/2.0/authorize)
       → 이 화면으로 돌아오면 바로 참여 → 내 기록(/r/{code}/add)
     이미 참여한 브라우저는 방 홈을 건너뛰고 내 기록으로 간다. 다른 브라우저는 "이미 참여했어요" → 이름 → 숫자 4자리 -->
<main id="page" aria-live="polite"><p class="muted">불러오는 중이에요</p></main>
<footer class="site-foot"><a class="sf-privacy" href="/flow/privacy">개인정보 처리방침</a><span class="sf-sep" aria-hidden="true">·</span><span>텅장방어전 · SPAN 팀</span></footer>
<script>
  (function () {
    "use strict";
    const code = decodeURIComponent(location.pathname.split("/")[2] || "");
    const enc = encodeURIComponent(code);
    const page = document.getElementById("page");
    const isNew = new URLSearchParams(location.search).has("new");

    /* ---------- 저장 (원래 방 레인 것 그대로) ---------- */
    const storageKey = `member_id:${code}`;
    const pinKey = `pin:${code}`;   // 내 기록(지출 레인 add.html)이 본인 확인에 쓰는 값. 참여 · 다시 들어오기 때 넣어 두면 다시 묻지 않는다
    function store(key, v) { try { if (v == null) localStorage.removeItem(key); else localStorage.setItem(key, String(v)); } catch (e) {} }
    function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    // 은행 화면에 다녀오는 동안 입력값이 사라지므로 잠깐 넣어 둔다 (탭을 닫으면 지워진다)
    const draftKey = `join_draft:${code}`;
    function getDraft() { try { return JSON.parse(sessionStorage.getItem(draftKey)) || {}; } catch (e) { return {}; } }
    function setDraft(d) { try { sessionStorage.setItem(draftKey, JSON.stringify(d)); } catch (e) {} }
    function clearDraft() { try { sessionStorage.removeItem(draftKey); } catch (e) {} }

    /* ---------- 그리기 도우미 (결과 카드 board.js 와 같은 모양: 사람 색 토큰 · 날짜) ---------- */
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const won = (n) => Math.abs(Math.round(n)).toLocaleString("ko-KR");
    const pad = (n) => String(n).padStart(2, "0");
    const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parse = (s) => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
    const WD = ["일", "월", "화", "수", "목", "금", "토"];
    const md = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
    const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
    const playerClass = (id) => `p${(((Number(id) - 1) % 6) + 6) % 6 + 1}`;
    function token(id, nickname, extra) {
      const first = Array.from(String(nickname || "?"))[0];
      return `<span class="token ${playerClass(id)}${extra ? " " + extra : ""}" aria-hidden="true">${esc(first)}</span>`;
    }

    const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const ICON = {
      eye: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
      eyeOff: svg('<path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
    };
    const eyeBtn = () => `<button type="button" class="eye-btn" aria-label="숫자 보이기" aria-pressed="false">${ICON.eye}</button>`;

    let room = null;
    let step = "form";        // form → (가짜 은행) → 참여 / rejoin → pin
    let claim = null;         // 다시 들어오기에서 고른 멤버
    let error = "";
    let joining = false;

    /* ---------- 은행에서 돌아왔을 때 (원래 방 레인 것 그대로) ---------- */
    // ?fintech_use_num=...&account_alias=...&state=... : 보낸 state 와 같은지 확인하고 계좌를 기억한다
    let bankReturned = false;
    (function takeBankResult() {
      const q = new URLSearchParams(location.search);
      if (!q.has("fintech_use_num")) return;
      const draft = getDraft();
      if (draft.state && q.get("state") === draft.state) {
        draft.account = { fintech_use_num: q.get("fintech_use_num"), alias: q.get("account_alias") || "가상 계좌" };
        delete draft.state;
        setDraft(draft);
        bankReturned = true;
      } else {
        error = "계좌 연결을 확인하지 못했어요. 다시 눌러 주세요.";
      }
      history.replaceState(null, "", location.pathname);   // 새로고침해도 다시 처리하지 않게
    })();

    function header() {
      const today = ymd(new Date());
      const left = daysBetween(today, room.end_date);
      const tail = today >= room.end_date ? "결과 공개" : `<b>D-${left}</b>`;
      return `<h1>${esc(room.name)}</h1>
        <p class="meta">${md(room.start_date)} – ${md(room.end_date)} · ${tail}</p>`;
    }

    function lineup() {
      const canRejoin = room.members.some((m) => m.has_pin);
      if (!room.members.length) return '<p class="who">아직 아무도 없어요. 첫 번째로 참전해요</p>';
      return `<p class="who who-row"><span>참전 <span class="n">${room.members.length}</span>명</span>${canRejoin ? '<button type="button" id="to-rejoin" class="text-btn">이미 참여했어요</button>' : ""}</p>
        <ul class="lineup compact">${room.members.map((m) => `
          <li class="player">${token(m.id, m.nickname)}<span class="pname">${esc(m.nickname)}</span></li>`).join("")}
          <li class="player"><span class="token is-empty">+</span><span class="pname">나</span></li></ul>`;
    }

    function shareBox() {
      return `
        <p class="flash">링크가 생겼어요. 단톡방에 보내 주세요</p>
        <div class="share">
          <input id="link" value="${esc(`${location.origin}/r/${enc}`)}" readonly aria-label="초대 링크">
          <button type="button" class="small secondary" id="copy">링크 복사</button>
        </div><hr>`;
    }

    function stepper(now) {
      const names = ["정보 입력", "은행 연결", "계좌 선택"];
      return `<ol class="stepper" aria-label="참여 단계">${names.map((n, i) =>
        `<li class="${i + 1 < now ? "is-done" : i + 1 === now ? "is-now" : ""}"${i + 1 === now ? ' aria-current="step"' : ""}>${n}</li>`).join("")}</ol>`;
    }

    // 예산 칸: 치는 동안 1,000 단위 콤마. 커서는 앞에 있던 숫자 개수 기준으로 제자리에
    function commaInput(el) {
      el.addEventListener("input", () => {
        const pos = el.selectionStart ?? el.value.length;
        const before = el.value.slice(0, pos).replace(/\D/g, "").length;
        const digits = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 9);
        el.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
        let i = 0;
        for (let seen = 0; i < el.value.length && seen < before; i++) if (/\d/.test(el.value[i])) seen++;
        try { el.setSelectionRange(i, i); } catch (e) { /* 무시 */ }
      });
    }

    function render() {
      page.className = "flow-step";   // 참여 단계는 영수증 길이와 버튼 자리를 고정한다 (flow.css)
      if (joining) {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          ${stepper(3)}
          <div class="step-body">
            <div class="loading" role="status">
              <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <p>참여하는 중이에요</p>
            </div>
          </div>`;
        return;
      }
      if (step === "rejoin") {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <div class="step-body">
            <button type="button" id="rejoin-back" class="text-btn back">이전으로</button>
            <h1>내 이름을 골라 주세요</h1>
            <p class="muted">참여할 때 정한 숫자 4자리로 다시 들어와요.</p>
            <ul class="pick-names">${room.members.filter((m) => m.has_pin).map((m) => `
              <li><button type="button" class="pick-name" data-id="${m.id}">${token(m.id, m.nickname)}<span>${esc(m.nickname)}</span></button></li>`).join("")}</ul>
          </div>`;
      } else if (step === "pin") {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <div class="step-body">
            <button type="button" id="pin-back" class="text-btn back">이전으로</button>
            <p class="pin-who">${token(claim.id, claim.nickname)}<b>${esc(claim.nickname)}</b></p>
            <h1 class="consent-title">숫자 4자리를 넣어 주세요</h1>
            <p class="muted consent-sub">참여할 때 정한 번호예요</p>
            <form id="pin-form" class="pin-form" novalidate>
              <div class="pin-field pin-field-big">
                <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="숫자 4자리">
                ${eyeBtn()}
              </div>
              <p class="danger" role="alert">${esc(error)}</p>
              <div class="step-actions"><button type="submit" class="wide">들어가기</button></div>
            </form>
          </div>`;
      } else {
        const d = getDraft();
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          ${stepper(1)}
          <div class="step-body">
            ${header()}
            ${lineup()}
            <hr>
            ${isNew ? shareBox() : ""}
            <form id="join" class="form" novalidate>
              <label>닉네임 <input name="nickname" maxlength="20" placeholder="방에서 쓸 이름" autocomplete="off" value="${esc(d.nickname || "")}"></label>
              <label>이번 주 예산 (원) <input name="budget" type="text" inputmode="numeric" placeholder="예: 100,000" autocomplete="off" value="${d.budget ? won(d.budget) : ""}"></label>
              <label>숫자 4자리 <span class="label-sub">다른 기기에서 다시 들어올 때 써요</span>
                <span class="pin-field"><input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="new-password" value="${esc(d.pin || "")}">${eyeBtn()}</span></label>
              <p class="danger" role="alert">${esc(error)}</p>
              <div class="step-actions">
                <button type="submit">${d.account ? "이 계좌로 참여하기" : "은행 연결하고 참여하기"}</button>
              </div>
            </form>
          </div>`;
      }
      document.title = `${room.name} · 텅장방어전`;
      error = "";
      bind();
    }

    function go(next) { step = next; render(); window.scrollTo(0, 0); }

    // 참여 API (원래 방 레인 것 그대로: 닉네임 · 예산 · 숫자 4자리 · 계좌)
    async function join() {
      const d = getDraft();
      joining = true;
      render();
      try {
        const res = await fetch(`/api/rooms/${enc}/members`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname: d.nickname, budget: Number(d.budget), pin: d.pin, fintech_use_num: (d.account || {}).fintech_use_num }),
        });
        if (res.status === 409) { error = "이미 있는 닉네임이에요. 나라면 위의 '이미 참여했어요'를 눌러 주세요."; return; }
        if (!res.ok) { error = "참여하지 못했어요. 닉네임, 예산, 숫자 4자리, 계좌 연결을 확인해 주세요."; return; }
        const member = await res.json();
        store(storageKey, member.id);
        store(pinKey, d.pin);
        clearDraft();
        location.replace(`/r/${enc}/add`);
        return;
      } catch (e) {
        error = "참여하지 못했어요. 잠시 후 다시 해 주세요.";
      } finally {
        joining = false;
      }
      render();
    }

    function bind() {
      const copy = document.getElementById("copy");
      if (copy) copy.addEventListener("click", async () => {
        const input = document.getElementById("link");
        try { await navigator.clipboard.writeText(input.value); } catch (e) { input.select(); }
        copy.textContent = "복사했어요";
        setTimeout(() => { copy.textContent = "링크 복사"; }, 1600);
      });

      page.querySelectorAll(".eye-btn").forEach((btn) => btn.addEventListener("click", (ev) => {
        ev.preventDefault();
        const input = btn.parentElement.querySelector("input");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.setAttribute("aria-pressed", String(show));
        btn.setAttribute("aria-label", show ? "숫자 숨기기" : "숫자 보이기");
        btn.innerHTML = show ? ICON.eyeOff : ICON.eye;
      }));

      const form = document.getElementById("join");
      if (form) {
        commaInput(form.elements.budget);
        form.addEventListener("submit", (ev) => {
          ev.preventDefault();
          const f = form.elements;
          const nickname = f.nickname.value.trim();
          const budget = Number(f.budget.value.replace(/[^\d]/g, ""));
          const pin = f.pin.value.trim();
          const keep = (extra) => setDraft(Object.assign(getDraft(), { nickname, budget: budget || "", pin }, extra || {}));
          if (!nickname) { error = "닉네임을 넣어 주세요."; keep(); return render(); }
          if (room.members.some((m) => m.nickname === nickname)) { error = "같은 닉네임이 있어요. 나라면 위의 '이미 참여했어요'를 눌러 주세요."; keep({ nickname: "" }); return render(); }
          if (!budget) { error = "예산을 넣어 주세요."; keep(); return render(); }
          if (!/^\d{4}$/.test(pin)) { error = "숫자 4자리를 정해 주세요."; keep({ pin: "" }); return render(); }
          keep();
          if (getDraft().account) { join(); return; }
          // [은행 연결하고 참여하기]: 가짜 은행 화면(② 동의 · ③ 계좌 선택)으로 보낸다
          const state = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
          keep({ state });
          const q = new URLSearchParams({ redirect_uri: `/r/${code}`, state });
          location.href = `/api/expenses/mockbank/oauth/2.0/authorize?${q}`;
        });
      }

      const toRejoin = document.getElementById("to-rejoin");
      if (toRejoin) toRejoin.addEventListener("click", () => go("rejoin"));
      const rejoinBack = document.getElementById("rejoin-back");
      if (rejoinBack) rejoinBack.addEventListener("click", () => go("form"));
      page.querySelectorAll(".pick-name").forEach((el) => el.addEventListener("click", () => {
        claim = room.members.find((m) => String(m.id) === el.getAttribute("data-id"));
        go("pin");
      }));
      const pinBack = document.getElementById("pin-back");
      if (pinBack) pinBack.addEventListener("click", () => go("rejoin"));

      // 다시 들어오기 (원래 방 레인 API 그대로)
      const pinForm = document.getElementById("pin-form");
      if (pinForm) {
        const input = document.getElementById("pin");
        input.focus();
        pinForm.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const pin = input.value.trim();
          if (!/^\d{4}$/.test(pin)) { error = "숫자 4자리를 넣어 주세요."; return render(); }
          const button = pinForm.querySelector('button[type="submit"]');
          button.disabled = true;
          try {
            const res = await fetch(`/api/rooms/${enc}/members/${claim.id}/rejoin`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ pin }),
            });
            if (res.ok) {
              store(storageKey, (await res.json()).id);
              store(pinKey, pin);
              location.replace(`/r/${enc}/add`);
              return;
            }
            const detail = (await res.json().catch(() => ({}))).detail;   // 401 · 403 은 서버 문장 그대로
            error = typeof detail === "string" ? detail : "숫자 4자리를 확인해 주세요.";
          } catch (e) {
            error = "들어가지 못했어요. 잠시 후 다시 해 주세요.";
          }
          render();
        });
      }
    }

    async function load() {
      let res;
      try { res = await fetch(`/api/rooms/${enc}`); } catch (e) { res = null; }
      if (res && res.status === 404) {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <h1>방을 찾을 수 없어요</h1>
          <p class="muted">링크를 다시 확인해 주세요. 마감 30일이 지난 방은 지워져요.</p>
          <a class="button wide" href="/">새 방 만들기</a>`;
        return;
      }
      if (!res || !res.ok) {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <h1>잠깐 문제가 생겼어요</h1>
          <p class="muted">잠시 후 새로고침해 주세요.</p>`;
        return;
      }
      room = await res.json();
      // 이 브라우저가 이미 참여한 방이면 방 홈은 건너뛰고 바로 내 기록으로 간다 (저장된 id 가 이 방 멤버가 아니면 지운다)
      const myId = read(storageKey);
      if (myId && room.members.some((m) => String(m.id) === myId)) { location.replace(`/r/${enc}/add`); return; }
      if (myId) store(storageKey, null);
      if (bankReturned && getDraft().account) { join(); return; }   // 은행에서 계좌를 고르고 왔으면 바로 참여
      render();
    }

    load();
  })();
</script>
<!-- 발표 모드(/flow 로 들어온 브라우저)에서만 위에 시연 막대를 띄운다. 일반 사용자에게는 아무것도 안 한다 -->
<script src="/static/board/flow/demo-bar.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>버티기 · 방</title>
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/rooms/rooms.css">
</head>
<body>
<main>
  <p id="loading" class="muted">불러오는 중...</p>

  <!-- 없는 방 -->
  <section id="not-found" hidden>
    <h1>방을 찾을 수 없어요</h1>
    <p class="muted">링크가 맞는지 확인해 주세요. 방을 만든 친구에게 링크를 다시 받아도 됩니다.</p>
    <p><a class="button" href="/">새 방 만들기</a></p>
  </section>

  <section id="room" hidden>
    <h1 id="title"></h1>
    <p id="period" class="muted"></p>

    <!-- 보드: 보드 레인의 API(/api/board/{code})로 그린다 -->
    <section id="board"></section>

    <!-- 참여 전 -->
    <form id="join" class="form" hidden>
      <h2>참여하기</h2>
      <label>닉네임 <input name="nickname" maxlength="20" required></label>
      <label>내 예산 (원) <input name="budget" type="number" inputmode="numeric" min="1" step="1" placeholder="예: 100000" required></label>
      <label>숫자 4자리 <input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" placeholder="다른 폰 · 브라우저에서 다시 들어올 때 써요" required></label>
      <p id="error" class="danger"></p>
      <button type="submit">참여하기</button>
    </form>

    <!-- 다시 들어오기: 위 목록에서 내 이름을 누르면 열린다 -->
    <form id="rejoin" class="form" hidden>
      <h2><span id="rejoin-name"></span>님, 다시 오셨네요</h2>
      <label>참여할 때 정한 숫자 4자리 <input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" required></label>
      <p id="rejoin-error" class="danger"></p>
      <button type="submit">들어가기</button>
      <p><a id="rejoin-cancel" href="#">내가 아니에요</a></p>
    </form>

    <!-- 참여 후 -->
    <section id="joined" hidden>
      <p><span id="me" class="me"></span>님으로 참여 중</p>
      <div class="actions">
        <a id="add" class="button" href="#">지출 올리기</a>
        <a id="go-board" class="button" href="#">보드</a>
      </div>
    </section>
  </section>
</main>
<script>
  const code = location.pathname.split("/")[2];
  const storageKey = `member_id:${code}`;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));

  function getMemberId() {
    try { return localStorage.getItem(storageKey); } catch { return null; }
  }
  function setMemberId(id) {
    try { localStorage.setItem(storageKey, String(id)); } catch {}
  }
  function clearMemberId() {
    try { localStorage.removeItem(storageKey); } catch {}
  }

  async function load() {
    const res = await fetch(`/api/rooms/${encodeURIComponent(code)}`);
    $("loading").hidden = true;
    if (res.status === 404) {
      $("not-found").hidden = false;
      return;
    }
    if (!res.ok) {
      $("loading").hidden = false;
      $("loading").textContent = "불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
      return;
    }
    const room = await res.json();
    document.title = `버티기 · ${room.name}`;
    $("title").textContent = room.name;
    $("period").textContent = `${room.start_date} ~ ${room.end_date}`;
    $("room").hidden = false;

    // 저장된 id 가 이 방의 멤버가 아니면 (데모 방을 다시 넣은 경우 등) 지운다
    let myId = getMemberId();
    const me = room.members.find(m => String(m.id) === myId);
    if (myId && !me) { clearMemberId(); myId = null; }

    await renderBoard(room, me);
    if (me) showJoined(me);
    else $("join").hidden = false;
  }

  async function renderBoard(room, me) {
    // TODO(보드 API): 김경은이 /api/board/{code} 응답 형식을 정하면, 응답으로 보드를 그리도록 바꾼다.
    // 지금은 보드 API 가 없어서 멤버 목록만 보여 준다. 여기서 직접 계산하지 않는다.
    // 아직 이 브라우저에서 참여 전이면, 4자리가 있는 멤버 이름을 눌러 다시 들어올 수 있다
    const name = m => !me && m.has_pin
      ? `<button type="button" class="link rejoin" data-id="${m.id}" data-name="${esc(m.nickname)}">${esc(m.nickname)}</button>`
      : `<span>${esc(m.nickname)}</span>`;
    const items = room.members.map(m =>
      `<li class="member${me && m.id === me.id ? " me" : ""}">${name(m)}<span class="muted">예산 ${m.budget.toLocaleString()}원</span></li>`
    ).join("");
    $("board").innerHTML = `
      <h2>멤버 ${room.members.length}명</h2>
      ${room.members.length ? `<ul class="list">${items}</ul>` : `<p class="muted">아직 아무도 없어요. 첫 번째로 참여해 보세요.</p>`}
      ${!me && room.members.some(m => m.has_pin) ? `<p class="muted">이미 참여했나요? 내 이름을 누르면 다시 들어갈 수 있어요.</p>` : ""}
      <p class="todo muted">남은 예산 보드가 여기에 들어올 자리입니다 (보드 레인).</p>`;
  }

  function showJoined(me) {
    $("join").hidden = true;
    $("rejoin").hidden = true;
    $("me").textContent = me.nickname;
    $("add").href = `/r/${code}/add`;
    $("go-board").href = `/r/${code}/board`;
    $("joined").hidden = false;
  }

  $("join").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    const button = form.querySelector("button");
    $("error").textContent = "";
    button.disabled = true;
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(code)}/members`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({nickname: form.nickname.value, budget: Number(form.budget.value), pin: form.pin.value}),
      });
      if (res.status === 409) { $("error").textContent = "이미 있는 닉네임이에요. 내 이름이면 위 목록에서 이름을 눌러 다시 들어오세요."; return; }
      if (!res.ok) { $("error").textContent = "참여하지 못했습니다. 닉네임, 예산, 숫자 4자리를 확인해 주세요."; return; }
      const member = await res.json();
      setMemberId(member.id);
      await load();
    } catch {
      $("error").textContent = "참여하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    } finally {
      button.disabled = false;
    }
  });

  // 다시 들어오기
  let rejoinId = null;

  $("board").addEventListener("click", e => {
    const b = e.target.closest(".rejoin");
    if (!b) return;
    rejoinId = b.dataset.id;
    $("rejoin-name").textContent = b.dataset.name;
    $("rejoin-error").textContent = "";
    $("rejoin").reset();
    $("join").hidden = true;
    $("rejoin").hidden = false;
    $("rejoin").pin.focus();
  });

  $("rejoin-cancel").addEventListener("click", e => {
    e.preventDefault();
    $("rejoin").hidden = true;
    $("join").hidden = false;
  });

  $("rejoin").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    const button = form.querySelector("button");
    $("rejoin-error").textContent = "";
    button.disabled = true;
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(code)}/members/${rejoinId}/rejoin`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pin: form.pin.value}),
      });
      if (res.ok) {
        setMemberId((await res.json()).id);
        await load();
        return;
      }
      // 401 (틀림) · 403 은 서버가 보낸 문장을 그대로 보여 준다
      const detail = (await res.json().catch(() => ({}))).detail;
      $("rejoin-error").textContent = typeof detail === "string" ? detail : "숫자 4자리를 확인해 주세요.";
      form.pin.value = "";
    } catch {
      $("rejoin-error").textContent = "들어가지 못했습니다. 잠시 후 다시 시도해 주세요.";
    } finally {
      button.disabled = false;
    }
  });

  load();
</script>
</body>
</html>

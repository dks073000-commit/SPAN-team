<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e4e9">
  <title>텅장방어전 · 방</title>
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/board/common-proposal.css">
  <link rel="stylesheet" href="/static/board/flow/flow.css">
  <link rel="stylesheet" href="/static/rooms/rooms.css">
</head>
<body>
<!-- 방 홈 · 참여. 화면 모양은 /flow/r/{code} (static/board/flow/room.html) 의 ① 정보 입력을 따른다.
     ② 은행 연결 동의 · ③ 계좌 선택은 가짜 은행 화면(지출 레인)이다 -->
<main id="page">
  <p class="brand">텅장방어전</p>
  <p id="loading" class="muted">불러오는 중이에요</p>

  <!-- 없는 방 -->
  <section id="not-found" hidden>
    <h1>방을 찾을 수 없어요</h1>
    <p class="muted">링크를 다시 확인해 주세요.</p>
    <a class="button wide" href="/">새 방 만들기</a>
  </section>

  <section id="room" class="step-body" hidden>
    <ol id="stepper" class="stepper" aria-label="참여 단계" hidden></ol>
    <h1 id="title"></h1>
    <p id="period" class="meta"></p>

    <!-- 참전 줄 (이름만, 10/3: 기간 중 방 홈은 참여자 이름만) + 다시 들어오기 이름 고르기 -->
    <section id="board"></section>

    <!-- 참여 전: ① 정보 입력 -->
    <form id="join" class="form" hidden>
      <hr>
      <label>닉네임 <input name="nickname" maxlength="20" placeholder="방에서 쓸 이름" autocomplete="off" required></label>
      <label>이번 주 예산 (원) <input name="budget" type="number" inputmode="numeric" min="1" step="1" placeholder="예: 100000" autocomplete="off" required></label>
      <label>숫자 4자리 <span class="label-sub">다른 기기에서 다시 들어올 때 써요</span>
        <input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="new-password" placeholder="••••" required></label>
      <!-- 가상 계좌 연결: 가짜 은행 화면에서 동의 → 내 계좌 선택 → 이 페이지로 돌아온다 -->
      <p id="bank-status" class="bank-picked" hidden></p>
      <p class="note">시연용 가상 계좌예요. 실제 은행과 연결되지 않아요.</p>
      <p id="error" class="danger" role="alert"></p>
      <div class="step-actions">
        <button type="submit" id="join-submit" class="wide" disabled hidden>참여하기</button>
        <button type="button" id="bank-connect" class="wide">은행 연결하고 참여하기</button>
      </div>
    </form>

    <!-- 다시 들어오기: 참전 줄의 "이미 참여했어요" → 내 이름 → 숫자 4자리 -->
    <form id="rejoin" class="form pin-form" hidden>
      <a id="rejoin-cancel" class="text-btn back" href="#">이전으로</a>
      <p class="pin-who"><span id="rejoin-token"></span><b id="rejoin-name"></b></p>
      <h1 class="consent-title">숫자 4자리를 넣어 주세요</h1>
      <p class="muted consent-sub">참여할 때 정한 번호예요</p>
      <input name="pin" class="pin-input" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" aria-label="숫자 4자리" required>
      <p id="rejoin-error" class="danger" role="alert"></p>
      <div class="step-actions"><button type="submit" class="wide">들어가기</button></div>
    </form>

    <!-- 참여 후 -->
    <section id="joined" hidden>
      <hr>
      <p class="me-meta"><span id="me-token"></span><span><b id="me" class="me"></b>님으로 참여 중</span></p>
      <div class="stack">
        <a id="add" class="button wide" href="#">내 기록</a>
        <a id="go-board" class="button secondary wide" href="#">결과</a>
      </div>
    </section>
  </section>
</main>
<script>
  const code = location.pathname.split("/")[2];
  const storageKey = `member_id:${code}`;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));

  // 사람 토큰: 닉네임 첫 글자 + member_id 로 정한 색 (UI 가이드: (id − 1) % 6 + 1)
  const token = (id, nickname, extra = "") =>
    `<span class="token p${(Number(id) - 1) % 6 + 1}${extra ? " " + extra : ""}" aria-hidden="true">${esc(Array.from(String(nickname || "?"))[0])}</span>`;

  // 날짜: toISOString 을 쓰지 않는다 (CLAUDE.md 시간대 규칙). "2026-10-02" → 10/2(금)
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const md = s => { const d = parseDay(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
  function periodText(room) {
    const t = new Date();
    const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const left = Math.round((parseDay(room.end_date) - today) / 86400000);
    const when = `${md(room.start_date)} – ${md(room.end_date)}`;
    return left <= 0 ? `${when} · 결과 공개` : `${when} · <b>D-${left}</b>`;
  }

  // 참여 세 단계: 정보 입력 → 은행 연결 → 계좌 선택. now 까지 지난 단계는 is-done
  function renderStepper(now) {
    const names = ["정보 입력", "은행 연결", "계좌 선택"];
    $("stepper").innerHTML = names.map((n, i) => {
      const cls = i + 1 < now ? "is-done" : i + 1 === now ? "is-now" : "";
      return `<li class="${cls}"${i + 1 === now ? ' aria-current="step"' : ""}>${n}</li>`;
    }).join("");
  }

  function getMemberId() {
    try { return localStorage.getItem(storageKey); } catch { return null; }
  }
  function setMemberId(id) {
    try { localStorage.setItem(storageKey, String(id)); } catch {}
  }
  function clearMemberId() {
    try { localStorage.removeItem(storageKey); } catch {}
  }

  // 은행 화면에 다녀오는 동안 입력값이 사라지므로 잠깐 넣어 둔다 (탭을 닫으면 지워진다)
  const draftKey = `join_draft:${code}`;
  function getDraft() {
    try { return JSON.parse(sessionStorage.getItem(draftKey)) || {}; } catch { return {}; }
  }
  function setDraft(draft) {
    try { sessionStorage.setItem(draftKey, JSON.stringify(draft)); } catch {}
  }
  function clearDraft() {
    try { sessionStorage.removeItem(draftKey); } catch {}
  }

  // 가짜 은행에서 돌아왔으면 (?fintech_use_num=...&account_alias=...&state=...) 보낸 state 와 같은지 확인하고 계좌를 기억한다
  function takeBankResult() {
    const q = new URLSearchParams(location.search);
    if (!q.has("fintech_use_num")) return;
    const draft = getDraft();
    if (draft.state && q.get("state") === draft.state) {
      draft.account = {fintech_use_num: q.get("fintech_use_num"), alias: q.get("account_alias") || "가상 계좌"};
      delete draft.state;
      setDraft(draft);
    } else {
      bankError = "계좌 연결을 확인하지 못했어요. 은행 연결을 다시 눌러 주세요.";
    }
    history.replaceState(null, "", location.pathname);   // 새로고침해도 다시 처리하지 않게 주소를 깨끗이
  }
  let bankError = "";

  function fillJoinForm() {
    const form = $("join");
    const draft = getDraft();
    for (const name of ["nickname", "budget", "pin"]) {
      if (draft[name] && !form[name].value) form[name].value = draft[name];
    }
    // 계좌를 고르고 돌아왔으면: 기본 버튼은 [참여하기], 은행 연결은 글자 버튼으로 (한 화면에 기본 버튼 하나)
    const linked = Boolean(draft.account);
    if (linked) {
      $("bank-status").innerHTML = `<span>가상 계좌 연결됨<span class="pick-sub">${esc(draft.account.alias)}</span></span>`;
      $("bank-connect").textContent = "다른 계좌로 바꾸기";
      $("bank-connect").className = "text-btn change";
    }
    $("bank-status").hidden = !linked;
    $("join-submit").hidden = !linked;
    $("join-submit").disabled = !linked;
    renderStepper(linked ? 3 : 1);
    $("error").textContent = bankError;
  }

  // 화면에 하나만: join(정보 입력) · pick(내 이름 고르기) · pin(숫자 4자리) · joined(참여 중)
  function show(view) {
    $("join").hidden = view !== "join";
    $("rejoin").hidden = view !== "pin";
    $("joined").hidden = view !== "joined";
    $("board").hidden = view === "pin";
    $("title").hidden = view === "pin" || view === "pick";
    $("period").hidden = view === "pin" || view === "pick";
    $("stepper").hidden = view !== "join";
    const picking = view === "pick";
    $("board").querySelectorAll(".lineup-wrap").forEach(el => { el.hidden = picking; });
    $("board").querySelectorAll(".rejoin-pick").forEach(el => { el.hidden = !picking; });
    // 참여 흐름 화면은 영수증 길이와 버튼 자리를 고정한다 (flow.css main.flow-step)
    $("page").className = view === "joined" ? "" : "flow-step";
  }

  async function load() {
    const res = await fetch(`/api/rooms/${encodeURIComponent(code)}`);
    $("loading").hidden = true;
    if (res.status === 404) {
      $("not-found").hidden = false;
      return;
    }
    if (!res.ok) {
      $("loading").hidden = false;
      $("loading").textContent = "불러오지 못했어요. 잠시 뒤 새로고침해 주세요.";
      return;
    }
    const room = await res.json();
    document.title = `${room.name} · 텅장방어전`;
    $("title").textContent = room.name;
    $("period").innerHTML = periodText(room);
    $("room").hidden = false;

    // 저장된 id 가 이 방의 멤버가 아니면 (데모 방을 다시 넣은 경우 등) 지운다
    let myId = getMemberId();
    const me = room.members.find(m => String(m.id) === myId);
    if (myId && !me) { clearMemberId(); myId = null; }

    await renderBoard(room, me);
    if (me) showJoined(me);
    else { show("join"); fillJoinForm(); }
  }

  async function renderBoard(room, me) {
    // 기간 중 방 홈은 참여자 이름만 보여 준다 (10/3). 순위 · 금액은 마감일 결과 카드(보드 레인)에서.
    // 아직 이 브라우저에서 참여 전이면, "이미 참여했어요" → 4자리가 있는 내 이름을 눌러 다시 들어올 수 있다
    const canRejoin = !me && room.members.some(m => m.has_pin);
    const players = room.members.map(m =>
      `<li class="player">${token(m.id, m.nickname, me && m.id === me.id ? "is-me" : "")}<span class="pname">${esc(m.nickname)}</span></li>`
    ).join("");
    const empty = me ? "" : `<li class="player"><span class="token is-empty" aria-hidden="true">+</span><span class="pname">나</span></li>`;
    const names = room.members.filter(m => m.has_pin).map(m =>
      `<li><button type="button" class="pick-name rejoin" data-id="${m.id}" data-name="${esc(m.nickname)}">${token(m.id, m.nickname)}<span>${esc(m.nickname)}</span></button></li>`
    ).join("");
    $("board").innerHTML = `
      <div class="lineup-wrap">
        ${room.members.length
          ? `<p class="who who-row"><span>참전 <span class="n">${room.members.length}</span>명</span>${canRejoin ? '<button type="button" id="to-rejoin" class="text-btn">이미 참여했어요</button>' : ""}</p>
             <ul class="lineup compact">${players}${empty}</ul>`
          : `<p class="who">아직 아무도 없어요. 첫 번째로 참전해요</p>`}
      </div>
      ${canRejoin ? `
      <div class="rejoin-pick" hidden>
        <button type="button" id="pick-back" class="text-btn back">이전으로</button>
        <h1>내 이름을 골라 주세요</h1>
        <p class="muted">참여할 때 정한 숫자 4자리로 다시 들어와요.</p>
        <ul class="pick-names">${names}</ul>
      </div>` : ""}`;
  }

  function showJoined(me) {
    show("joined");
    $("me").textContent = me.nickname;
    $("me-token").innerHTML = token(me.id, me.nickname, "is-me");
    $("add").href = `/r/${code}/add`;
    $("go-board").href = `/r/${code}/board`;
  }

  $("join").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    const button = $("join-submit");
    $("error").textContent = "";
    button.disabled = true;
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(code)}/members`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          nickname: form.nickname.value,
          budget: Number(form.budget.value),
          pin: form.pin.value,
          fintech_use_num: (getDraft().account || {}).fintech_use_num,
        }),
      });
      if (res.status === 409) { $("error").textContent = "같은 닉네임이 있어요. 나라면 위의 '이미 참여했어요'를 눌러 주세요."; return; }
      if (!res.ok) { $("error").textContent = "참여하지 못했어요. 닉네임, 예산, 숫자 4자리, 계좌 연결을 확인해 주세요."; return; }
      const member = await res.json();
      setMemberId(member.id);
      clearDraft();
      await load();
    } catch {
      $("error").textContent = "참여하지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    } finally {
      button.disabled = false;
    }
  });

  // [은행 연결하고 참여하기]: 입력값을 확인하고 넣어 둔 뒤 가짜 은행 화면으로 보낸다
  $("bank-connect").addEventListener("click", () => {
    const form = $("join");
    if (!form.reportValidity()) return;
    const state = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    setDraft({nickname: form.nickname.value, budget: form.budget.value, pin: form.pin.value, state});
    const q = new URLSearchParams({redirect_uri: `/r/${code}`, state});
    location.href = `/api/expenses/mockbank/oauth/2.0/authorize?${q}`;
  });

  // 다시 들어오기
  let rejoinId = null;

  $("board").addEventListener("click", e => {
    if (e.target.closest("#to-rejoin")) { show("pick"); return; }
    if (e.target.closest("#pick-back")) { show("join"); return; }
    const b = e.target.closest(".rejoin");
    if (!b) return;
    rejoinId = b.dataset.id;
    $("rejoin-name").textContent = b.dataset.name;
    $("rejoin-token").innerHTML = token(b.dataset.id, b.dataset.name);
    $("rejoin-error").textContent = "";
    $("rejoin").reset();
    show("pin");
    $("rejoin").pin.focus();
  });

  $("rejoin-cancel").addEventListener("click", e => {
    e.preventDefault();
    show("pick");
  });

  $("rejoin").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    const button = form.querySelector("button");
    $("rejoin-error").textContent = "";
    button.disabled = true;
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(code)}/members/${rejoinId}/rejoin`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pin: form.pin.value}),
      });
      if (res.ok) {
        setMemberId((await res.json()).id);
        await load();
        return;
      }
      // 401 (틀림) · 403 은 서버가 보낸 문장을 그대로 보여 준다
      const detail = (await res.json().catch(() => ({}))).detail;
      $("rejoin-error").textContent = typeof detail === "string" ? detail : "숫자 4자리를 확인해 주세요.";
      form.pin.value = "";
    } catch {
      $("rejoin-error").textContent = "들어가지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    } finally {
      button.disabled = false;
    }
  });

  takeBankResult();
  load();
</script>
</body>
</html>

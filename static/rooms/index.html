<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e4e9">
  <title>텅장방어전 · 방 만들기</title>
  <!-- 모양은 UI 가이드(static/board/ui-guide.html) 그대로. 공용 common.css 는 건드리지 않고 보드 레인 스타일을 직접 읽는다 -->
  <link rel="stylesheet" href="/static/board/common-proposal.css">
  <link rel="stylesheet" href="/static/board/flow/flow.css">
</head>
<body>
<!-- 방 만들기. 화면의 일: 링크 만들기 하나. 만들면 방 홈(/r/{code}?new=1)에서 링크를 복사한다 -->
<main>
  <p class="brand">텅장방어전</p>
  <h1 class="hook">이번 주 예산,<br>누가 끝까지 버틸까?</h1>
  <div class="versus" aria-hidden="true">
    <span class="token p1 is-me">나</span><span class="vs">VS</span>
    <span class="token is-empty">?</span><span class="token is-empty">?</span><span class="token is-empty">?</span>
  </div>
  <hr>
  <form id="create" class="form" novalidate>
    <label>방 이름 <input name="name" maxlength="40" placeholder="예: 10월 둘째 주 방어전" autocomplete="off"></label>
    <div class="two">
      <label>시작 <input type="date" name="start_date"></label>
      <label>마감 <input type="date" name="end_date"></label>
    </div>
    <!-- API 가 받는 값 (화면에는 고르는 칸을 두지 않는다): 주 1회, 일요일 -->
    <input type="hidden" name="upload_cycle" value="7">
    <input type="hidden" name="deadline_weekday" value="6">
    <p class="danger" id="error" role="alert"></p>
    <button type="submit">링크 만들기</button>
  </form>
</main>
<footer class="site-foot"><a class="sf-privacy" href="/flow/privacy">개인정보 처리방침</a><span class="sf-sep" aria-hidden="true">·</span><span>텅장방어전 · SPAN 팀</span></footer>
<script>
  const form = document.getElementById("create");
  // 날짜는 한국 시간으로 (toISOString 을 쓰지 않는다: CLAUDE.md 시간대 규칙)
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const plusDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
  const f = form.elements;
  f.start_date.value = ymd(new Date());
  f.end_date.value = plusDays(f.start_date.value, 6);
  f.end_date.min = f.start_date.value;
  // 시작일을 바꾸면 마감이 비었거나 시작보다 앞일 때 시작 + 6일로 맞춘다
  f.start_date.addEventListener("change", () => {
    if (!f.start_date.value) return;
    f.end_date.min = f.start_date.value;
    if (!f.end_date.value || f.end_date.value < f.start_date.value) f.end_date.value = plusDays(f.start_date.value, 6);
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const error = document.getElementById("error");
    error.textContent = "";
    if (!f.name.value.trim()) { error.textContent = "방 이름을 넣어 주세요."; return; }
    if (!f.start_date.value || !f.end_date.value) { error.textContent = "시작일과 마감일을 골라 주세요."; return; }
    if (f.end_date.value < f.start_date.value) { error.textContent = "마감일이 시작일보다 빨라요."; return; }
    const body = {
      name: f.name.value.trim(),
      start_date: f.start_date.value,
      end_date: f.end_date.value,
      upload_cycle: Number(f.upload_cycle.value),
      deadline_weekday: Number(f.deadline_weekday.value),
    };
    const button = form.querySelector("button");
    button.disabled = true;
    try {
      const res = await fetch("/api/rooms", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error();
      const room = await res.json();
      location.href = `${room.path}?new=1`;   // 방 홈에서 "링크가 생겼어요" + 링크 복사
    } catch {
      error.textContent = "방을 만들지 못했어요. 입력을 확인하고 다시 해 주세요.";
      button.disabled = false;
    }
  });
</script>
<!-- 발표 모드(/flow 로 들어온 브라우저)에서만 위에 시연 막대를 띄운다. 일반 사용자에게는 아무것도 안 한다 -->
<script src="/static/board/flow/demo-bar.js" defer></script>
</body>
</html>

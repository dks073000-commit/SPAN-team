<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e4e9">
  <title>가상은행 · 계좌 연결</title>
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/board/flow/flow.css">
</head>
<body>
<!-- 참여 ③ 계좌 선택 (가짜 은행 화면). 보드 레인 시안 static/board/flow/room.html 의 계좌 선택 단계를 그대로 옮겼다.
     동의는 방 화면(② 은행 연결)에서 이미 받았으니 여기서는 계좌만 고른다 (10/6).
     시안과 다른 곳: 고른 계좌를 redirect_uri 로 돌려주는 form · [이전으로] · 시연용 안내(방 화면에서 이쪽으로 옮겨 옴) -->
<main class="flow-step">
  <p class="brand">텅장방어전</p>
  <ol class="stepper" aria-label="참여 단계"><li class="is-done">정보 입력</li><li class="is-done">은행 연결</li><li class="is-now" aria-current="step">계좌 선택</li></ol>
  <form method="post" action="/api/expenses/mockbank/oauth/2.0/authorize" class="step-body">
    <input type="hidden" name="redirect_uri" id="redirect_uri">
    <input type="hidden" name="state" id="state">
    <button type="button" class="cancel text-btn back">이전으로</button>
    <h1>이 방에서 쓸 계좌를<br>골라 주세요</h1>
    <p class="muted">연결된 계좌 <span class="n"><!--ACCOUNT_COUNT--></span>개 · 고른 계좌의 출금 내역만 불러와요</p>
    <p class="note">시연용 가상 계좌예요. 실제 은행과 연결되지 않아요.</p>
    <div class="accounts">
<!--ACCOUNTS-->
    </div>
    <div class="step-actions">
      <button type="submit" class="wide">이 계좌 연결하기</button>
    </div>
  </form>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const back = params.get("redirect_uri") || "/";
  document.getElementById("redirect_uri").value = back;
  document.getElementById("state").value = params.get("state") || "";

  // 이전으로: 아무것도 연결하지 않고 들어오기 전 화면으로 그냥 돌아간다
  for (const button of document.querySelectorAll(".cancel")) {
    button.addEventListener("click", () => {
      if (history.length > 1) history.back();
      else location.href = back;
    });
  }
</script>
</body>
</html>

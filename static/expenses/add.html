<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e4e9">
  <title>텅장방어전 · 내 페이지</title>
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/board/flow/flow.css">
</head>
<body>
<!-- 내 기록 (지출 레인 /r/{code}/add). 보드 레인 시안 static/board/flow/me.html 을 그대로 복사했다.
     바꾼 곳은 데이터 자리뿐이다: store.js 의 가짜 함수(localStorage) 대신 아래 Real 이 실제 API 를 부른다.
     화면의 일: 남은 돈을 보고, 다음 할 일 하나(불러오기 → 조정 완료)를 한다. 다른 사람 순위는 없다 (10/3) -->
<main id="page" aria-live="polite"><p class="muted">불러오는 중이에요</p></main>
<script src="/static/board/flow/store.js"></script>
<script>
  // store.js "바꿔 끼우는 자리" 의 실제 버전. 화면 코드는 시안 그대로 F.load · F.totals 등을 부른다
  window.Real = (function () {
    "use strict";
    const code = decodeURIComponent(location.pathname.split("/")[2] || "");
    const MEMBER_KEY = `member_id:${code}`;   // 방 레인이 참여 · 다시 들어오기 때 저장한다
    const PIN_KEY = `pin:${code}`;            // 참여 때 정한 숫자 4자리 (본인 확인, 10/6)
    const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 막힌 브라우저 */ } };
    const drop = (k) => { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } };
    let summary = null;

    class NeedPin extends Error {}
    async function api(method, url, body) {
      const headers = { "X-Member-Pin": get(PIN_KEY) || "" };
      if (body) headers["Content-Type"] = "application/json";
      const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({}));
      const detail = typeof data.detail === "string" ? data.detail : "잠시 뒤에 다시 해 주세요";
      if (res.status === 401) { drop(PIN_KEY); throw new NeedPin(detail); }
      if (!res.ok) throw new Error(detail);
      return data;
    }
    const memberId = () => Number(get(MEMBER_KEY));
    const body = () => ({ member_id: memberId() });

    // 지출 API 응답 → store.js 의 state · member · expense 모양
    function state() {
      if (!summary) return null;
      const s = summary;
      return {
        room: { code, name: s.room_name, start_date: s.start_date, end_date: s.end_date },
        members: [{ id: s.member_id, nickname: s.nickname, budget: s.budget, account: s.account,
          confirmed_at: s.status === "미확인" ? null : 1, gave_up_at: s.status === "항복" ? 1 : null }],
        expenses: s.items.map((i) => ({
          member_id: s.member_id, ref: String(i.id), merchant: i.merchant, amount: i.amount, people: i.people,
          excluded: i.excluded, auto: i.auto ? "가승인 취소" : null, spent_on: i.date, time: null,
          hint: i.badges.filter((b) => !b.startsWith("자동 제외")).join(" · ") || null,
        })),
      };
    }
    const totals = (st, m) => ({
      spent: summary.spent, remaining: summary.remaining, unconfirmed: summary.status === "미확인",
      items: st.expenses.filter((e) => e.member_id === m.id),
    });

    return {
      code, NeedPin, memberId,
      hasMember: () => Boolean(get(MEMBER_KEY)),
      hasPin: () => Boolean(get(PIN_KEY)),
      setPin: (pin) => put(PIN_KEY, pin),
      load: () => state(),
      myId: () => (summary ? summary.member_id : null),
      member: (st, id) => (st ? st.members.find((m) => m.id === id) || null : null),
      totals,
      accountName: (account) => account || "내 계좌",
      async fetch() { summary = await api("GET", `/api/expenses/me?member_id=${encodeURIComponent(memberId())}`); },
      async importTx() { const res = await api("POST", "/api/expenses/import", body()); summary = res.summary; return res.added; },
      async confirm() { summary = await api("POST", "/api/expenses/confirm", body()); },
      async updateItem(ref, change) { summary = await api("PATCH", `/api/expenses/${ref}`, { ...body(), ...change }); },
      async giveUp() {   // 항복은 방 레인 API
        await api("POST", `/api/rooms/${encodeURIComponent(code)}/members/${encodeURIComponent(memberId())}/give-up`);
        await this.fetch();
      },
      // 아래 고정 탭 [내 기록 | 결과]: store.js tabbar 와 같은 마크업, 주소만 실제 화면
      tabbar(st) {
        if (!st || document.querySelector("nav.tabbar")) return;
        const info = Flow.roomInfo(st.room);
        const enc = encodeURIComponent(code);
        const icon = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
        const nav = document.createElement("nav");
        nav.className = "tabbar";
        nav.setAttribute("aria-label", "이 방에서 이동");
        nav.innerHTML = `
      <a href="/r/${enc}/add" aria-current="page">${icon('<path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>')}<span>내 기록</span></a>
      <a href="/r/${enc}/board">${icon('<circle cx="12" cy="14" r="6"/><path d="M8.5 3h7l-2 6.2M10.5 9.2L8.5 3"/><path d="M12 11.5v5"/>')}<span>결과${info.result_open ? "" : ` <em>${icon('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 2)}D-${info.days_left}</em>`}</span></a>`;
        document.body.append(nav);
        document.body.classList.add("has-tabbar");
      },
    };
  })();
</script>
<script>
  (function () {
    "use strict";
    const F = Object.assign({}, Flow, Real);   // 그리는 도우미(md · won · esc · token · share)는 시안 것, 데이터는 실제 API
    const code = Real.code;
    const enc = encodeURIComponent(code);
    const page = document.getElementById("page");
    let flash = "";
    let editing = false;     // 조정 완료 뒤 '수정하기'를 눌러 다시 고치는 중
    let focusKey = "";       // 인원 − + 를 누른 뒤 다시 그려도 같은 버튼에 초점을 둔다
    const MAX_PEOPLE = 20;
    const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V3.5"/><path d="M5 4h12.5l-2.5 4.25 2.5 4.25H5" fill="#fff"/></svg>';
    F.footer();   // 바닥글 (개인정보 처리방침). 시연 막대(toolbar)는 시안 전용이라 가져오지 않는다 (flow/README)

    function render() {
      const state = F.load(code);
      const meId = F.myId(code);
      const me = state && meId != null ? F.member(state, meId) : null;
      if (!state || !me) {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <h1>먼저 방에 참여해 주세요</h1>
          <a class="button wide" href="/r/${enc}">참여하러 가기</a>`;
        return;
      }

      const info = F.roomInfo(state.room);
      const t = F.totals(state, me);
      const gaveUp = me.gave_up_at != null;
      const items = t.items.slice().sort((a, b) => (a.spent_on + (a.time || "")).localeCompare(b.spent_on + (b.time || "")));
      const hasItems = items.length > 0;
      const dday = info.result_open ? "결과 공개" : F.daysLeft(info.days_left);

      // 가장 큰 글자: 목표까지 남은 돈 (항복하면 항복)
      let hero;
      if (gaveUp) {
        hero = `<h1 class="money">항복했어요</h1><p class="sub">결과 카드에는 깃발만 남아요</p>`;
      } else {
        // 조정 완료는 아래 거래 판에 큰 도장으로 찍는다 (여기서는 확정 전 상태만)
        const state1 = !hasItems ? '<span class="tag">불러오기 전</span>'
          : t.unconfirmed ? '<span class="tag">미확인</span>' : "";
        const goal = t.remaining >= 0
          ? `<p class="kicker">목표까지</p><h1 class="money"><mark><span class="n">${F.won(t.remaining)}</span>원</mark> 남았어요</h1>`
          : `<p class="kicker">예산을</p><h1 class="money"><span class="n">${F.won(t.remaining)}</span>원 넘겼어요</h1>`;
        hero = `
          <div class="hero-top">
            <div class="hero-goal">${goal}</div>
            <button type="button" id="quit" class="quit-btn" aria-haspopup="dialog">${FLAG}<span>항복</span></button>
          </div>
          <p class="sub"><span><span class="n">${F.won(me.budget)}</span>원 중 <span class="n">${F.won(t.spent)}</span>원 썼어요</span>${state1}</p>`;
        // 남은 예산 막대: 여유 → 주의 → 위험 → 초과
        const left = Math.max(0, Math.round((t.remaining / me.budget) * 100));
        const level = t.remaining < 0 ? "over" : left >= 50 ? "ok" : left >= 20 ? "warn" : "danger";
        let pace = "";
        if (!info.result_open && t.remaining >= 0) {
          const days = info.days_left + 1;
          const perDay = Math.floor(t.remaining / days / 100) * 100;
          pace = `<p class="pace">남은 <span class="n">${days}</span>일 · 하루 <span class="n">${F.won(perDay)}</span>원까지 OK</p>`;
        } else if (t.remaining < 0) {
          pace = '<p class="pace">여기서 멈추면 더 내려가지 않아요</p>';
        }
        hero += `
          <div class="gauge-row"><span>남은 예산</span><b>${t.remaining < 0 ? "0" : left}%</b></div>
          <div class="gauge" data-level="${level}" style="--left:${left}%"><span></span></div>
          ${pace}`;
      }

      // 조정 완료 뒤에는 잠근다. 다시 고치려면 '수정하기'
      const locked = hasItems && !t.unconfirmed && !editing;
      const peopleText = (n) => (n === 1 ? "혼자" : `<span class="n">${n}</span>명`);

      const rows = items.map((e) => {
        const sub = [];
        sub.push(`<span class="when">${F.md(e.spent_on)}</span>`);
        if (e.time) sub.push(`<span class="when"><span class="n">${e.time}</span></span>`);
        if (e.people > 1 && !e.excluded) sub.push(`<span class="when">내 몫 <span class="n">${F.won(F.share(e.amount, e.people))}</span>원</span>`);

        let ctl;
        if (e.auto) ctl = `<span class="stamp stamp-gray">${e.auto}</span>`;
        else if (gaveUp) ctl = "";
        else if (locked) {
          ctl = e.excluded ? '<span class="out-mark">제외</span>'
            : `<span class="ctl-val">${e.people === 1 ? "혼자" : `<span class="n">${e.people}</span>명이서`}</span>`;
        } else {
          const name = F.esc(e.merchant);
          ctl = `
            <span class="count" role="group" aria-label="${name} 같이 낸 사람">
              <button type="button" data-ref="${e.ref}" data-step="-1" aria-label="한 명 빼기"${e.people <= 1 ? " disabled" : ""}>−</button>
              <span class="count-n" aria-live="polite">${peopleText(e.people)}</span>
              <button type="button" data-ref="${e.ref}" data-step="1" aria-label="한 명 더하기"${e.people >= MAX_PEOPLE ? " disabled" : ""}>+</button>
            </span>
            <label class="toggle"><input type="checkbox" data-ref="${e.ref}" data-field="excluded"${e.excluded ? " checked" : ""} aria-label="${name} 제외"><span>제외</span></label>`;
        }
        return `
          <li class="tx${e.excluded ? " is-out" : ""}">
            <span class="what">${F.esc(e.merchant)}</span>
            <span class="amt"><span class="n">${F.won(e.amount)}</span>원</span>
            <span class="tx-sub">${sub.join("")}</span>
            <span class="ctl">${ctl}</span>
            ${e.hint ? `<span class="tx-hint"><span class="tag">${e.hint}</span></span>` : ""}
          </li>`;
      }).join("");

      const needConfirm = hasItems && (t.unconfirmed || editing) && !gaveUp;
      let action = "";
      if (!gaveUp && !hasItems) action = `<button type="button" id="load" class="wide">${F.accountName(me.account)}에서 불러오기</button>`;
      else if (needConfirm) action = '<div class="sticky"><button type="button" id="confirm" class="wide">조정 완료</button></div>';
      else if (locked && !gaveUp) action = '<button type="button" id="edit" class="secondary wide edit-btn">수정하기</button>';

      page.innerHTML = `
        <p class="brand">텅장방어전</p>
        <p class="meta me-meta">${F.token(me.id, me.nickname, gaveUp ? "is-quit" : "is-me")}<span>${F.esc(me.nickname)} · ${F.esc(state.room.name)} · <b>${dday}</b></span></p>
        ${hero}
        ${flash ? `<p class="flash" role="status">${flash}</p>` : ""}
        ${!hasItems ? `<hr>${action}` : ""}
        ${hasItems ? `
          <section class="panel${locked && !gaveUp ? " is-locked" : ""}" aria-label="불러온 거래">
            ${locked && !gaveUp ? '<span class="stamp stamp-blue done-stamp">조정 완료</span>' : ""}
            <p class="list-head"><span>불러온 거래 <span class="n">${items.length}</span>건</span>${gaveUp || locked ? "" : '<button type="button" id="load" class="text-btn">새로 불러오기</button>'}</p>
            <p class="privacy-note">이 목록은 나만 봐요 · 친구에게는 총액만 보여요</p>
            <ul class="list">${rows}</ul>
            ${action}
          </section>` : ""}`;
      document.title = `내 페이지 · ${state.room.name}`;
      F.tabbar(state);
      flash = "";

      const load = document.getElementById("load");
      if (load) load.addEventListener("click", () => run(async () => {
        const added = await F.importTx(code, meId);
        flash = added ? "" : "새 거래가 없어요";
        render();
      }));
      const confirmBtn = document.getElementById("confirm");
      if (confirmBtn) confirmBtn.addEventListener("click", () => run(async () => {
        await F.confirm(code, meId);
        editing = false;
        flash = "조정 완료. 결과 카드에 이대로 들어가요";
        render();
        window.scrollTo(0, 0);
      }));
      const edit = document.getElementById("edit");
      if (edit) edit.addEventListener("click", () => {
        editing = true;
        render();
        const first = page.querySelector(".tx .count button:not(:disabled), .tx .toggle input");
        if (first) first.focus();
      });
      const quit = document.getElementById("quit");
      if (quit) quit.addEventListener("click", () => openQuit(me));
      page.querySelectorAll("[data-field]").forEach((el) => el.addEventListener("change", () => run(async () => {
        await F.updateItem(el.getAttribute("data-ref"), { excluded: el.checked });
        focusKey = `${el.getAttribute("data-ref")}:x`;
        render();
      })));
      page.querySelectorAll("[data-step]").forEach((el) => el.addEventListener("click", () => {
        const ref = el.getAttribute("data-ref");
        const item = items.find((e) => e.ref === ref);
        const next = Math.min(MAX_PEOPLE, Math.max(1, item.people + Number(el.getAttribute("data-step"))));
        if (next === item.people) return;
        run(async () => {
          await F.updateItem(ref, { people: next });
          focusKey = `${ref}:${el.getAttribute("data-step")}`;
          render();
        });
      }));
      if (focusKey) {
        const [ref, what] = focusKey.split(":");
        const sel = what === "x" ? `[data-ref="${ref}"][data-field]` : `[data-ref="${ref}"][data-step="${what}"]`;
        const el = page.querySelector(sel);
        // 끝까지 가서 버튼이 꺼지면 반대쪽 버튼으로
        const target = el && el.disabled ? page.querySelector(`[data-ref="${ref}"][data-step="${-Number(what)}"]`) : el;
        if (target) target.focus({ preventScroll: true });
        focusKey = "";
      }
    }

    // 항복 확인: 아래에서 올라오는 판. 기본 버튼은 '계속 버티기'
    const sheet = document.createElement("div");
    sheet.className = "quit-sheet";
    sheet.hidden = true;
    sheet.innerHTML = `
      <div class="qs-backdrop" data-close></div>
      <section class="qs-panel" role="dialog" aria-modal="true" aria-labelledby="qs-title" aria-describedby="qs-desc">
        <span class="qs-flag">${FLAG}</span>
        <h2 id="qs-title">정말 항복할까요?</h2>
        <p id="qs-desc" class="muted">되돌릴 수 없어요. 결과 카드에는 깃발만 남아요.</p>
        <div class="stack">
          <button type="button" class="wide" data-close>계속 버티기</button>
          <button type="button" id="giveup" class="danger-line wide">항복하기</button>
        </div>
      </section>`;
    document.body.append(sheet);
    let quitFor = null;
    function openQuit(me) {
      quitFor = me.id;
      sheet.hidden = false;
      document.body.style.overflow = "hidden";
      sheet.querySelector(".qs-panel [data-close]").focus();
    }
    function closeQuit() {
      sheet.hidden = true;
      document.body.style.overflow = "";
      const q = document.getElementById("quit");
      if (q) q.focus();
    }
    sheet.addEventListener("click", (ev) => {
      if (ev.target.closest("[data-close]")) closeQuit();
      if (ev.target.closest("#giveup") && quitFor != null) {
        quitFor = null;
        sheet.hidden = true;
        document.body.style.overflow = "";
        run(async () => {
          await F.giveUp();
          render();
          window.scrollTo(0, 0);
        });
      }
    });
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !sheet.hidden) closeQuit(); });

    // API 를 기다리는 동작: 4자리가 틀리면 4자리 화면, 그 밖의 오류는 flash 로
    let busy = false;
    async function run(task) {
      if (busy) return;
      busy = true;
      try { await task(); }
      catch (e) {
        if (e instanceof Real.NeedPin) { renderPin(e.message); return; }
        flash = e.message;
        render();
      } finally { busy = false; }
    }

    function renderPin(error) {
      page.className = "flow-step";
      page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <div class="step-body">
            <h1 class="consent-title">숫자 4자리를 넣어 주세요</h1>
            <p class="muted consent-sub">참여할 때 정한 번호예요</p>
            <form id="pin-form" class="pin-form" novalidate>
              <div class="pin-field pin-field-big">
                <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="숫자 4자리">
              </div>
              <p class="danger" role="alert">${F.esc(error || "")}</p>
              <div class="step-actions"><button type="submit" class="wide">들어가기</button></div>
            </form>
          </div>`;
      const input = document.getElementById("pin");
      input.focus();
      document.getElementById("pin-form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const pin = input.value.trim();
        if (!/^\d{4}$/.test(pin)) { renderPin("숫자 4자리를 넣어 주세요."); return; }
        Real.setPin(pin);
        start();
      });
    }

    function start() {
      page.className = "";
      if (!Real.hasMember()) { render(); return; }      // 참여 전: "먼저 방에 참여해 주세요"
      if (!Real.hasPin()) { renderPin(""); return; }
      run(async () => { await Real.fetch(); render(); });
    }
    start();
  })();
</script>
</body>
</html>

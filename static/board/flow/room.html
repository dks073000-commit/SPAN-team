<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e4e9">
  <title>텅장방어전 · 방</title>
  <link rel="stylesheet" href="/static/board/common-proposal.css">
  <link rel="stylesheet" href="/static/board/flow/flow.css">
</head>
<body>
<!-- 방 홈 · 참여 (시연용). 실제 화면은 방 레인 /r/{code} (static/rooms/room.html).
     참여 순서 = 실제 오픈뱅킹 순서:
       ① 닉네임 · 예산 → ② 은행 연결하기 (실제: 금융결제원 사용자 인증 · 정보 제공 동의 화면, 우리가 만들지 않는다)
       → ③ 계좌 불러오는 중 (실제: 토큰 발급 + 등록계좌조회) → ④ 이 방에 쓸 계좌 고르기 (fintech_use_num 저장) → 참여 완료
     한 번 연결한 사람은 ②를 건너뛴다 (실제: 토큰 재사용) -->
<main id="page" aria-live="polite"><p class="muted">불러오는 중이에요</p></main>
<script src="/static/board/flow/store.js"></script>
<script>
  (function () {
    "use strict";
    const F = Flow;
    const code = decodeURIComponent(location.pathname.split("/")[3] || "");
    const enc = encodeURIComponent(code);
    const page = document.getElementById("page");
    const params = new URLSearchParams(location.search);
    F.toolbar(code);

    let step = "form";          // form → consent → loading → accounts

    // 동의 화면 아이콘 (선 아이콘, 잉크색 하나)
    const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const ICON = {
      eye: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
      lock: svg('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
      people: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.2 3.2 0 0 1 0 6.3M18 14.3c1.8.8 3 2.6 3 4.7"/>'),
      trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
      eyeOff: svg('<path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
    };

    // 숫자 4자리 칸 옆 눈 버튼 (누르면 숫자가 보였다 숨었다)
    const eyeBtn = () => `<button type="button" class="eye-btn" aria-label="숫자 보이기" aria-pressed="false">${ICON.eye}</button>`;
    let pending = null;         // { nickname, budget, pin }
    let claimId = null;         // 다시 들어오기에서 고른 내 이름
    let chosen = "A";
    let error = "";

    const state = F.load(code);
    if (!state) {
      page.innerHTML = `
        <p class="brand">텅장방어전</p>
        <h1>방을 찾을 수 없어요</h1>
        <p class="muted">링크를 다시 확인해 주세요.</p>
        <a class="button wide" href="/flow">새 방 만들기</a>`;
      return;
    }
    const info = F.roomInfo(state.room);

    // 이 브라우저가 이미 참여한 방이면 방 홈은 건너뛰고 바로 내 기록으로 간다
    if (F.myId(code) != null && F.member(state, F.myId(code))) {
      location.replace(`/flow/r/${enc}/me`);
      return;
    }

    function header() {
      const when = info.result_open
        ? `${F.md(info.start_date)} – ${F.md(info.end_date)} · 결과 공개`
        : `${F.md(info.start_date)} – ${F.md(info.end_date)} · <b>${F.daysLeft(info.days_left)}</b>`;
      return `
        <p class="brand">텅장방어전</p>
        <h1>${F.esc(state.room.name)}</h1>
        <p class="meta">${when}</p>`;
    }

    function lineup(meId, joined) {
      if (!state.members.length) return '<p class="who">아직 아무도 없어요. 첫 번째로 참전해요</p>';
      // "이미 참여했어요"는 참전 줄 제목 오른쪽에 (화면 한 장 길이 안에 들어가게)
      return `<p class="who who-row"><span>참전 <span class="n">${state.members.length}</span>명</span>${joined ? "" : '<button type="button" id="to-rejoin" class="text-btn">이미 참여했어요</button>'}</p>
        <ul class="lineup compact">${state.members.map((m) => `
          <li class="player">${F.token(m.id, m.nickname, m.id === meId ? "is-me" : "")}<span class="pname">${F.esc(m.nickname)}</span></li>`).join("")}
          ${joined ? "" : '<li class="player"><span class="token is-empty">+</span><span class="pname">나</span></li>'}</ul>`;
    }

    function shareBox() {
      return `
        <div class="share">
          <input id="link" value="${F.esc(F.roomLink(code))}" readonly aria-label="초대 링크">
          <button type="button" class="small secondary" id="copy">링크 복사</button>
        </div>`;
    }

    // 참여 흐름 세 단계: 지금 어디인지 위에 보여 준다
    function stepper(now) {
      const names = ["정보 입력", "은행 연결", "계좌 선택"];
      return `<ol class="stepper" aria-label="참여 단계">${names.map((n, i) =>
        `<li class="${i + 1 < now ? "is-done" : i + 1 === now ? "is-now" : ""}"${i + 1 === now ? ' aria-current="step"' : ""}>${n}</li>`).join("")}</ol>`;
    }

    // 동의 '자세히 보기' 팝업: 법이 알리라고 정한 것만, 짧게 (① 개인정보보호법 15조2항 ② 26조 ③ 금융실명법 4조1항 · 신용정보법 32조1항)
    function termsDialog() {
      return `
        <dialog id="terms" class="terms-sheet" aria-labelledby="terms-title">
          <div class="ts-panel">
            <span class="ts-handle" aria-hidden="true"></span>
            <h2 id="terms-title">동의 내용 자세히 보기</h2>
            <section>
              <h3>① 개인정보 수집 · 이용</h3>
              <dl>
                <div><dt>받는 곳</dt><dd>텅장방어전 (SPAN 팀)</dd></div>
                <div><dt>쓰는 목적</dt><dd>이 방의 예산 사용률 계산과 결과 카드</dd></div>
                <div><dt>받는 항목</dt><dd>닉네임, 예산, 숫자 4자리(알아볼 수 없게 바꿔 저장), 고른 계좌의 출금 날짜 · 시간 · 금액 · 가게 이름</dd></div>
                <div><dt>보관 기간</dt><dd>방 마감 후 바로 삭제</dd></div>
                <div><dt>거부할 권리</dt><dd>동의하지 않아도 돼요. 다만 출금 내역을 불러올 수 없어 이 방에는 참여할 수 없어요</dd></div>
              </dl>
              <p class="ts-law">개인정보보호법 제15조 제2항</p>
            </section>
            <section>
              <h3>② 처리 위탁</h3>
              <dl>
                <div><dt>Render</dt><dd>서버 운영 (화면을 보여 주고 사용률을 계산)</dd></div>
                <div><dt>Supabase</dt><dd>데이터베이스 보관 (방 · 참여자 · 출금 내역 저장)</dd></div>
              </dl>
              <p class="ts-law">개인정보보호법 제26조</p>
            </section>
            <section>
              <h3>③ 금융거래정보 제공</h3>
              <p>은행이 출금 내역을 텅장방어전에 보내려면 내 동의가 따로 필요해요. 실제 서비스에서는 은행 인증 화면에서 한 번 더 동의해요.</p>
              <p class="ts-law">금융실명법 제4조 제1항 · 신용정보법 제32조 제1항</p>
            </section>
            <button type="button" class="wide secondary" id="terms-close">닫기</button>
          </div>
        </dialog>`;
    }

    // 예산 칸: 치는 동안 1,000 단위 콤마. 커서는 앞에 있던 숫자 개수 기준으로 제자리에
    function commaInput(el) {
      el.addEventListener("input", () => {
        const pos = el.selectionStart ?? el.value.length;
        const before = el.value.slice(0, pos).replace(/\D/g, "").length;
        const digits = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 9);
        el.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
        let i = 0;
        for (let seen = 0; i < el.value.length && seen < before; i++) if (/\d/.test(el.value[i])) seen++;
        try { el.setSelectionRange(i, i); } catch (e) { /* 커서를 못 옮기는 브라우저: 무시 */ }
      });
    }

    function render() {
      const meId = F.myId(code);
      const me = meId != null ? F.member(state, meId) : null;
      // 참여 흐름 단계는 영수증 길이와 버튼 자리를 고정한다 (flow.css main.flow-step)
      page.className = me ? "" : "flow-step";

      if (me) {
        location.replace(`/flow/r/${enc}/me`);
        return;
      } else if (step === "rejoin") {
        // 다른 브라우저에서 다시 들어오기 ①: 참전 줄에서 내 이름 고르기
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <div class="step-body">
            <button type="button" id="rejoin-back" class="text-btn back">이전으로</button>
            <h1>내 이름을 골라 주세요</h1>
            <p class="muted">참여할 때 정한 숫자 4자리로 다시 들어와요.</p>
            <ul class="pick-names">${state.members.map((m) => `
              <li><button type="button" class="pick-name" data-id="${m.id}">${F.token(m.id, m.nickname, m.gave_up_at ? "is-quit" : "")}<span>${F.esc(m.nickname)}</span></button></li>`).join("")}</ul>
          </div>`;
      } else if (step === "pin") {
        // 다시 들어오기 ②: 숫자 4자리
        const who = F.member(state, claimId);
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          <div class="step-body">
            <button type="button" id="pin-back" class="text-btn back">이전으로</button>
            <p class="pin-who">${F.token(who.id, who.nickname)}<b>${F.esc(who.nickname)}</b></p>
            <h1 class="consent-title">숫자 4자리를 넣어 주세요</h1>
            <p class="muted consent-sub">참여할 때 정한 번호예요</p>
            <form id="pin-form" class="pin-form" novalidate>
              <div class="pin-field pin-field-big">
                <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="숫자 4자리">
                ${eyeBtn()}
              </div>
              <p class="danger" role="alert">${error}</p>
              <div class="step-actions"><button type="submit" class="wide">들어가기</button></div>
            </form>
          </div>`;
      } else if (step === "consent") {
        // ② 은행 연결 동의: 돈 이야기를 하는 순간이라 게임 요소(색 토큰, VS) 없이 차분하게
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          ${stepper(2)}
          <div class="step-body">
            <button type="button" id="consent-back" class="text-btn back">이전으로</button>
            <h1 class="consent-title">계좌 조회를 허락해 주세요</h1>
            <p class="muted consent-sub">${F.md(info.start_date)} ~ ${F.md(info.end_date)} 출금 내역만 봐요</p>
            <ul class="scope">
              <li><span class="sc-ic">${ICON.eye}</span><div><b>텅장방어전이 보는 것</b><span>날짜 · 금액 · 가게 이름</span></div></li>
              <li><span class="sc-ic">${ICON.lock}</span><div><b>텅장방어전이 못 하는 것</b><span>송금 · 결제 · 비밀번호 저장</span></div></li>
              <li><span class="sc-ic">${ICON.people}</span><div><b>친구가 보는 것</b><span>총액과 순위만</span></div></li>
              <li><span class="sc-ic">${ICON.trash}</span><div><b>지우는 때</b><span>방이 끝나면 바로</span></div></li>
            </ul>
            <label class="agree agree-terms"><input type="checkbox" id="agree"><span><b>[필수]</b> 위 내용으로 계좌 조회에 동의해요</span></label>
            <p class="agree-note">수집 항목 · 보관 기간 · 맡기는 곳 안내 <button type="button" id="terms-open" class="text-btn" aria-haspopup="dialog">자세히 보기</button></p>
            <p class="danger" role="alert">${error}</p>
            ${termsDialog()}
            <div class="step-actions">
              <button type="button" id="consent-ok" class="wide" disabled>동의하고 계좌 불러오기</button>
            </div>
          </div>`;
      } else if (step === "loading") {
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          ${stepper(2)}
          <div class="step-body">
            <div class="loading" role="status">
              <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <p>${F.BANK_NAME}에서 계좌를 불러오는 중이에요</p>
            </div>
          </div>`;
      } else if (step === "accounts") {
        // ④ 등록계좌조회 결과: 은행 이름 + 가린 계좌번호. 고른 계좌의 fintech_use_num 이 members 에 저장된다
        const picks = Object.entries(F.ACCOUNTS).map(([key, a]) => `
          <label class="pick"><input type="radio" name="account" value="${key}"${key === chosen ? " checked" : ""}>
            <span>${F.BANK_NAME} ${a.alias}<span class="pick-sub">${a.masked}</span></span></label>`).join("");
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          ${stepper(3)}
          <div class="step-body">
            <h1>이 방에서 쓸 계좌를<br>골라 주세요</h1>
            <p class="muted">연결된 계좌 <span class="n">${Object.keys(F.ACCOUNTS).length}</span>개 · 고른 계좌의 출금 내역만 불러와요</p>
            <div class="accounts">${picks}</div>
            <div class="step-actions">
              <button type="button" id="pick-ok" class="wide">이 계좌로 참여하기</button>
            </div>
          </div>`;
      } else {
        // ① 닉네임 · 예산
        page.innerHTML = `
          <p class="brand">텅장방어전</p>
          ${stepper(1)}
          <div class="step-body">
            <h1>${F.esc(state.room.name)}</h1>
            <p class="meta">${info.result_open ? `${F.md(info.start_date)} – ${F.md(info.end_date)} · 결과 공개` : `${F.md(info.start_date)} – ${F.md(info.end_date)} · <b>${F.daysLeft(info.days_left)}</b>`}</p>
            ${lineup(null, false)}
            <hr>
            ${params.has("new") ? `<p class="flash">링크가 생겼어요. 단톡방에 보내 주세요</p>${shareBox()}<hr>` : ""}
            <form id="join" class="form" novalidate>
              <label>닉네임 <input name="nickname" maxlength="20" placeholder="방에서 쓸 이름" autocomplete="off" value="${pending ? F.esc(pending.nickname) : ""}"></label>
              <label>이번 주 예산 (원) <input name="budget" type="text" inputmode="numeric" placeholder="예: 100,000" autocomplete="off" value="${pending && pending.budget ? F.won(pending.budget) : ""}"></label>
              <label>숫자 4자리 <span class="label-sub">다른 기기에서 다시 들어올 때 써요</span>
                <span class="pin-field"><input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="new-password">${eyeBtn()}</span></label>
              <p class="danger" role="alert">${error}</p>
              <div class="step-actions">
                <button type="submit">${F.bankLinked() ? "계좌 고르고 참여하기" : "은행 연결하고 참여하기"}</button>
              </div>
            </form>
          </div>`;
      }
      document.title = `${state.room.name} · 텅장방어전`;
      error = "";
      bind();
    }

    function go(next) { step = next; render(); window.scrollTo(0, 0); }

    function loadAccounts() {
      go("loading");
      setTimeout(() => go("accounts"), 900);   // 실제: 토큰 발급 + 등록계좌조회 요청 시간
    }

    function bind() {
      const copy = document.getElementById("copy");
      if (copy) copy.addEventListener("click", async () => {
        const input = document.getElementById("link");
        try { await navigator.clipboard.writeText(input.value); } catch (e) { input.select(); }
        copy.textContent = "복사했어요";
        setTimeout(() => { copy.textContent = "링크 복사"; }, 1600);
      });

      // 눈 버튼: 바로 옆 숫자 칸을 보이기 / 숨기기
      page.querySelectorAll(".eye-btn").forEach((btn) => btn.addEventListener("click", (ev) => {
        ev.preventDefault();
        const input = btn.parentElement.querySelector("input");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.setAttribute("aria-pressed", String(show));
        btn.setAttribute("aria-label", show ? "숫자 숨기기" : "숫자 보이기");
        btn.innerHTML = show ? ICON.eyeOff : ICON.eye;
      }));

      // 동의 자세히 보기: 닫기 버튼 · 바깥 탭 · ESC(브라우저 기본)로 닫힘
      const terms = document.getElementById("terms");
      const termsOpen = document.getElementById("terms-open");
      if (terms && termsOpen) {
        termsOpen.addEventListener("click", () => { if (terms.showModal) terms.showModal(); else terms.setAttribute("open", ""); });
        document.getElementById("terms-close").addEventListener("click", () => terms.close ? terms.close() : terms.removeAttribute("open"));
        terms.addEventListener("click", (ev) => { if (ev.target === terms) terms.close(); });
      }

      const form = document.getElementById("join");
      if (form) commaInput(form.elements.budget);
      if (form) form.addEventListener("submit", (ev) => {
        ev.preventDefault();
        const f = form.elements;
        const nickname = f.nickname.value.trim();
        const budget = Number(f.budget.value.replace(/[^\d]/g, ""));
        const pin = f.pin.value.trim();
        if (!nickname) { error = "닉네임을 넣어 주세요."; return render(); }
        if (state.members.some((m) => m.nickname === nickname)) { error = "같은 닉네임이 있어요. 나라면 위의 '이미 참여했어요'를 눌러 주세요."; pending = { nickname: "", budget: budget || "" }; return render(); }
        if (!budget || budget < 1000) { error = "예산은 1,000원 이상으로 넣어 주세요."; pending = { nickname, budget: "" }; return render(); }
        if (!/^\d{4}$/.test(pin)) { error = "숫자 4자리를 정해 주세요."; pending = { nickname, budget }; return render(); }
        pending = { nickname, budget, pin };
        if (F.bankLinked()) loadAccounts(); else go("consent");
      });

      const ok = document.getElementById("consent-ok");
      const agree = document.getElementById("agree");
      if (agree && ok) agree.addEventListener("change", () => { ok.disabled = !agree.checked; });
      if (ok) ok.addEventListener("click", () => {
        if (!document.getElementById("agree").checked) { error = "동의에 체크해 주세요."; return render(); }
        F.linkBank();
        loadAccounts();
      });
      const back = document.getElementById("consent-back");
      if (back) back.addEventListener("click", () => go("form"));

      const toRejoin = document.getElementById("to-rejoin");
      if (toRejoin) toRejoin.addEventListener("click", () => go("rejoin"));
      const rejoinBack = document.getElementById("rejoin-back");
      if (rejoinBack) rejoinBack.addEventListener("click", () => go("form"));
      page.querySelectorAll(".pick-name").forEach((el) => el.addEventListener("click", () => { claimId = Number(el.getAttribute("data-id")); go("pin"); }));
      const pinBack = document.getElementById("pin-back");
      if (pinBack) pinBack.addEventListener("click", () => go("rejoin"));
      const pinForm = document.getElementById("pin-form");
      if (pinForm) {
        const input = document.getElementById("pin");
        input.focus();
        pinForm.addEventListener("submit", (ev) => {
          ev.preventDefault();
          const pin = input.value.trim();
          if (!/^\d{4}$/.test(pin)) { error = "숫자 4자리를 넣어 주세요."; return render(); }
          const res = F.claim(code, claimId, pin);
          if (res.ok) { location.href = `/flow/r/${enc}/me`; return; }
          error = res.lockedFor ? `여러 번 틀려서 ${res.lockedFor}초 뒤에 다시 할 수 있어요.` : `번호가 맞지 않아요. ${res.left}번 더 할 수 있어요.`;
          render();
        });
      }

      const pickOk = document.getElementById("pick-ok");
      if (pickOk) {
        page.querySelectorAll('input[name="account"]').forEach((el) => el.addEventListener("change", () => { chosen = el.value; }));
        pickOk.addEventListener("click", () => {
          F.join(code, { nickname: pending.nickname, budget: pending.budget, account: chosen, pin: pending.pin });
          location.href = `/flow/r/${enc}/me`;
        });
      }
    }

    render();
  })();
</script>
</body>
</html>
